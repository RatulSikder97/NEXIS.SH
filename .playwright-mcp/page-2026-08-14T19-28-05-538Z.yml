    - region "FAQ" [ref=f1e660]:
      - generic [ref=f1e661]:
        - generic [ref=f1e662]: FREQUENTLY ASKED
        - heading "The first questions every engineering team asks." [level=2] [ref=f1e665]
        - list [ref=f1e666]:
          - listitem [ref=f1e667]:
            - button "How does NEXIS know which patches are safe to apply?" [expanded] [ref=f1e668]
            - paragraph [ref=f1e674]: Every patch is validated in a Docker-isolated shadow pipeline. Synthesiser generates candidates, QA agents author unit + property tests against your contracts, and the patch only surfaces for approval after the test suite passes with zero regressions.
          - listitem [ref=f1e675]:
            - button "What happens if the patch is wrong?" [ref=f1e676]
            - paragraph [ref=f1e680]: Approval Gate routes every diff to a human owner. You see the patch, the failing test it now passes, and a plain-English summary before clicking approve. Nothing ships without you. If something does break post-deploy, NEXIS auto-rolls back via the same deployment surface (ArgoCD / GitHub Actions).
          - listitem [ref=f1e681]:
            - button "How do you keep our secrets safe?" [ref=f1e682]
            - paragraph [ref=f1e686]: Every integration credential is encrypted at rest with KeyVault and never logged. Agents run inside ephemeral containers with no network egress except to whitelisted provider APIs. We are SOC 2 Type I in progress and will publish a public security page when audit completes.
          - listitem [ref=f1e687]:
            - button "Which models does NEXIS use?" [ref=f1e688]
            - paragraph [ref=f1e692]: We default to a tuned mix of Claude Sonnet 4.5 for codegen and a smaller routing model for classification, with optional self-host adapters. Token usage is metered and exposed on /console/ai-energy so you can see exactly what each fix costs.
          - listitem [ref=f1e693]:
            - button "Can we run NEXIS on-prem?" [ref=f1e694]
            - paragraph [ref=f1e698]: Enterprise tier supports a self-hosted control plane behind your VPC, with all agent inference proxied through your existing model gateway. Talk to sales for deployment patterns.
          - listitem [ref=f1e699]:
            - button "What does an approval look like in practice?" [ref=f1e700]
            - paragraph [ref=f1e704]: "You receive a Slack DM (or PagerDuty page if it's high severity). One link opens a diff view with the failing test → passing test transition, the data lineage Pathfinder traced, and an Approve / Reject button. Median engineer time: 60 seconds."
        - paragraph [ref=f1e705]:
          - text: More questions?
          - link "Read the docs →" [ref=f1e706] [cursor=pointer]:
            - /url: /docs
