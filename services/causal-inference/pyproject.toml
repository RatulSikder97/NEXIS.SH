[project]
name = "nexis-causal"
version = "0.1.0"
description = "Phase 6 canned-response causal-inference sidecar. Phase 7 swaps the lookup table for a real DoWhy estimand search."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "tests"]
