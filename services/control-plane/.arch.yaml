version: 3
workdir: .

allow:
  depOnAnyVendor: true

commonComponents:
  - main
  - tests

components:
  main:
    in: cmd/**
  tests:
    in: tests/**
  domain:
    in: internal/domain
  usecase:
    in: internal/usecase/**
  adapter:
    in: internal/adapter/**
  transport:
    in:
      - internal/transport
      - internal/transport/**
  platform:
    in: internal/platform/**
  workflow:
    in: internal/workflow/**
  sentinel:
    in: internal/sentinel/**
  graphstore:
    in: internal/adapter/graphstore/**
  causal:
    in: internal/adapter/causal/**
  approval:
    in: internal/adapter/approval/**
  notifier:
    in: internal/adapter/notifier/**

deps:

  main:
    mayDependOn: [domain, usecase, adapter, transport, platform, workflow, sentinel, graphstore]
  tests:
    mayDependOn: [domain, usecase, adapter, transport, platform, workflow, sentinel, graphstore]
  domain:
    anyVendorDeps: true
  usecase:
    # Phase 5 — the eval harness composes adapter types (agents.Registry,
    # llm.Providers, retrieval.Store, repo.EvalRepo/TokenLedgerRepo) per
    # provider so the OpenAI vs Ollama matrix runs from one binary. Lives
    # in usecase because the HTTP handler + CLI both call into it; moving
    # the orchestration to adapter would leak HTTP / CLI awareness into
    # the adapter layer.
    mayDependOn: [domain, adapter, platform]
  adapter:
    # adapter→adapter is allowed so a top-level adapter package (e.g. auth/)
    # can compose its sibling sub-adapters (auth/local, auth/workos) via a
    # factory. Without this rule the factory would have to live outside the
    # adapter tree, which would break encapsulation.
    #
    # adapter→workflow is allowed for Phase 4: the WorkflowService adapter
    # (internal/adapter/workflow) wraps the Temporal client + the
    # internal/workflow/recovery package (workflow + activity registrations).
    # Without this rule the bridge would have to live in main, which would
    # leak Temporal types into the cmd-package surface.
    mayDependOn: [domain, platform, adapter, workflow]
  transport:
    mayDependOn: [usecase, domain, platform, transport, adapter]
  workflow:
    mayDependOn: [usecase, domain, adapter, platform]
  sentinel:
    mayDependOn: [domain, platform, usecase, adapter]
  graphstore:
    mayDependOn: [domain, platform]
  causal:
    mayDependOn: [domain, platform]
  approval:
    mayDependOn: [domain, platform, adapter]
  notifier:
    mayDependOn: [domain, platform, adapter]
  platform:
    anyVendorDeps: true
