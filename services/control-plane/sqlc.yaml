version: "2"
sql:
  - schema:
      - "migrations/0001_init.up.sql"
    queries: "internal/adapter/repo/queries"
    engine: "postgresql"
    gen:
      go:
        package: "repo"
        out: "internal/adapter/repo"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
