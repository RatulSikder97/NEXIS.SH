[project]
name = "nexis-fixture"
version = "0.0.1"
description = "Synthetic fixture project for the Nexis validator sandbox"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["nexis_fixture"]
