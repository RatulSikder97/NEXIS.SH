<text x="118" y="411" font-size="12.5" font-weight="bold" fill="#1f2937">PagerDuty</text>
<text x="118" y="428" font-size="10" fill="#4b5563">fault / alert webhook sources</text>

<!-- GitHub -->
<rect x="805" y="140" width="235" height="72" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
