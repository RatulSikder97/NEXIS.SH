<rect x="558" y="580" width="110" height="13" fill="#ffffff"/>
<text x="562" y="590" font-size="10" fill="#4b5563">code-graph nodes and edges</text>
<rect x="558" y="593" width="78" height="13" fill="#ffffff"/>
<text x="562" y="603" font-size="10" fill="#4b5563">(write / query)</text>
<!-- Nexis <-> MinIO -->
<rect x="650" y="556" width="190" height="13" fill="#ffffff"/>
<text x="745" y="566" text-anchor="middle" font-size="10" fill="#4b5563">encrypted patch blob (store / retrieve)</text>

<text x="550" y="748" text-anchor="middle" font-size="11" fill="#6b7280">Notation — rectangle: external entity &#183; circle: process &#183; open-ended rectangle: data store. Every data flow crosses the system boundary through process 0.</text>
</svg>
