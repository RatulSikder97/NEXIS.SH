<path d="M295 409 L431 409" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>

<!-- Nexis <-> GitHub -->
<path d="M618 288 C 680 250, 750 200, 803 164" stroke="#1f2937" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
<path d="M803 190 C 750 225, 690 275, 640 308" stroke="#1f2937" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>

<!-- Nexis <-> Large Language Model Provider -->
<path d="M667 372 C 715 375, 760 383, 803 392" stroke="#1f2937" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
<path d="M803 430 C 760 428, 715 421, 665 412" stroke="#1f2937" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>

<!-- Nexis <-> data stores (orthogonal, read/write) -->
<path d="M490 487 L490 575 L220 575 L220 641" stroke="#1f2937" stroke-width="1.3" fill="none" marker-start="url(#ahr)" marker-end="url(#ah)"/>
<path d="M550 503 L550 641" stroke="#1f2937" stroke-width="1.3" fill="none" marker-start="url(#ahr)" marker-end="url(#ah)"/>
<path d="M610 487 L610 575 L880 575 L880 641" stroke="#1f2937" stroke-width="1.3" fill="none" marker-start="url(#ahr)" marker-end="url(#ah)"/>

