<!-- User -> Nexis -->
<rect x="306" y="174" width="140" height="13" fill="#ffffff"/>
<text x="376" y="184" text-anchor="middle" font-size="10" fill="#4b5563">login credentials, commands,</text>
<rect x="330" y="187" width="92" height="13" fill="#ffffff"/>
<text x="376" y="197" text-anchor="middle" font-size="10" fill="#4b5563">approval decisions</text>
<!-- Nexis -> User -->
<rect x="291" y="282" width="154" height="13" fill="#ffffff"/>
<text x="368" y="292" text-anchor="middle" font-size="10" fill="#4b5563">dashboards, incident timelines,</text>
<rect x="324" y="295" width="88" height="13" fill="#ffffff"/>
<text x="368" y="305" text-anchor="middle" font-size="10" fill="#4b5563">approval requests</text>
