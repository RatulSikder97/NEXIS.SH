<rect x="670" y="345" width="148" height="13" fill="#ffffff"/>
<text x="744" y="355" text-anchor="middle" font-size="10" fill="#4b5563">structured completion request</text>
<!-- LLM provider -> Nexis -->
<rect x="656" y="442" width="148" height="13" fill="#ffffff"/>
<text x="730" y="452" text-anchor="middle" font-size="10" fill="#4b5563">structured completion response</text>
<!-- Nexis <-> PostgreSQL -->
<rect x="288" y="542" width="134" height="13" fill="#ffffff"/>
