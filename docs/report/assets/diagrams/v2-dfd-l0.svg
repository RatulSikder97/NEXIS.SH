<rect width="1100" height="800" fill="#ffffff"/>
<text x="550" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Data Flow Diagram, Level 0</text>
<text x="550" y="60" text-anchor="middle" font-size="12" fill="#6b7280">Context-level data flow</text>

<!-- ============ central process (circle) ============ -->
<circle cx="550" cy="385" r="118" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="550" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">0</text>
<text x="550" y="368" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Nexis</text>
<text x="550" y="392" text-anchor="middle" font-size="11.5" fill="#4b5563">Control-Plane and</text>
<text x="550" y="408" text-anchor="middle" font-size="11.5" fill="#4b5563">Nine-Agent Self-Healing Loop</text>

<!-- ============ external entities (rectangles) ============ -->
<!-- User -->
<rect x="60" y="140" width="235" height="88" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
