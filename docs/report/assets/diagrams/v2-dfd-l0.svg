<!-- Large Language Model Provider -->
<rect x="805" y="370" width="235" height="88" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-brain" x="821" y="388" width="28" height="28"/></g>
<text x="861" y="398" font-size="12.5" font-weight="bold" fill="#1f2937">Large Language Model</text>
<text x="861" y="413" font-size="12.5" font-weight="bold" fill="#1f2937">Provider</text>
<text x="861" y="430" font-size="10" fill="#4b5563">OpenAI / Ollama</text>

