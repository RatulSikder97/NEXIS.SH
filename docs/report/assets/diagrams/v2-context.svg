<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="Helvetica, Arial, sans-serif">
<defs>
<symbol id="i-person" viewBox="0 0 24 24">
  <circle cx="12" cy="7.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M4.5 20.5c0-4.2 3.4-6.8 7.5-6.8s7.5 2.6 7.5 6.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</symbol>
<symbol id="i-robot" viewBox="0 0 24 24">
  <rect x="4" y="8" width="16" height="12" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="9" cy="14" r="1.3" fill="currentColor" stroke="none"/>
  <circle cx="15" cy="14" r="1.3" fill="currentColor" stroke="none"/>
  <path d="M12 8V4.5M9.5 4.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M8.5 18h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
</symbol>
<symbol id="i-git" viewBox="0 0 24 24">
  <circle cx="6" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="6" cy="19" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="18" cy="12" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M6 7.2V16.8M6 8c0 5 3 4.5 10 4.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
</symbol>
<symbol id="i-chat" viewBox="0 0 24 24">
  <path d="M3 5.5h18v11H9l-4 3.5v-3.5H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="7" y1="9.5" x2="17" y2="9.5" stroke="currentColor" stroke-width="1.4"/>
  <line x1="7" y1="12.7" x2="14" y2="12.7" stroke="currentColor" stroke-width="1.4"/>
</symbol>
<symbol id="i-brain" viewBox="0 0 24 24">
  <path d="M9 3.5a3.3 3.3 0 0 0-3.3 3.3v.3A3 3 0 0 0 4 9.8a3.1 3.1 0 0 0 1 5.7 3.2 3.2 0 0 0 3.6 3.9A3.2 3.2 0 0 0 12 21V6.8A3.3 3.3 0 0 0 9 3.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M15 3.5a3.3 3.3 0 0 1 3.3 3.3v.3A3 3 0 0 1 20 9.8a3.1 3.1 0 0 1-1 5.7 3.2 3.2 0 0 1-3.6 3.9A3.2 3.2 0 0 1 12 21V6.8a3.3 3.3 0 0 1 3-3.3Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
</symbol>
<symbol id="i-workflow" viewBox="0 0 24 24">
  <rect x="2" y="10" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <rect x="17" y="10" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="12" cy="4.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M7 12.5h3M14 12.5h3M12 7v3M12 10l-2.5 2.5M12 10l2.5 2.5" stroke="currentColor" stroke-width="1.5"/>
</symbol>
<symbol id="i-card" viewBox="0 0 24 24">
  <rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <line x1="2" y1="9.5" x2="22" y2="9.5" stroke="currentColor" stroke-width="1.6"/>
  <line x1="5" y1="14.5" x2="10" y2="14.5" stroke="currentColor" stroke-width="1.6"/>
</symbol>
<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L0,6 L8,3 z" fill="#1f2937"/>
</marker>
</defs>

<rect width="1200" height="740" fill="#ffffff"/>
<text x="600" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Figure 1: System Context Diagram</text>
<text x="600" y="60" text-anchor="middle" font-size="12" fill="#6b7280">Nexis and the external actors and systems it exchanges data with</text>

<!-- center platform box -->
<rect x="430" y="290" width="340" height="160" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="600" y="355" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Nexis</text>
<text x="600" y="376" text-anchor="middle" font-size="11.5" fill="#4b5563">Multi-Agent Autonomous</text>
<text x="600" y="392" text-anchor="middle" font-size="11.5" fill="#4b5563">Engineering Platform</text>
<text x="600" y="418" text-anchor="middle" font-size="10" fill="#6b7280">(nexis.sh — registered, not yet live)</text>

<!-- left: human actors -->
<g>
  <rect x="60" y="130" width="230" height="480" rx="8" fill="#f4f5f7" stroke="none"/>
  <text x="80" y="118" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6b7280">HUMAN ACTORS</text>

  <g color="#1f2937"><use href="#i-person" x="90" y="170" width="30" height="30"/></g>
  <text x="135" y="185" font-size="13" font-weight="bold" fill="#1f2937">Owner / Administrator</text>
  <text x="135" y="201" font-size="10" fill="#4b5563">membership, billing, policy,</text>
  <text x="135" y="214" font-size="10" fill="#4b5563">final high-risk approval</text>

  <g color="#1f2937"><use href="#i-person" x="90" y="330" width="30" height="30"/></g>
  <text x="135" y="345" font-size="13" font-weight="bold" fill="#1f2937">Engineer / Member</text>
  <text x="135" y="361" font-size="10" fill="#4b5563">investigates incidents,</text>
  <text x="135" y="374" font-size="10" fill="#4b5563">approves/rejects/modifies patches</text>

  <g color="#1f2937"><use href="#i-person" x="90" y="490" width="30" height="30"/></g>
  <text x="135" y="505" font-size="13" font-weight="bold" fill="#1f2937">Viewer</text>
  <text x="135" y="521" font-size="10" fill="#4b5563">read-only observer</text>
  <text x="135" y="534" font-size="10" fill="#4b5563">(stakeholder / auditor)</text>
</g>

<!-- special: 9-agent fleet actor, bottom-left-center -->
<g color="#1f2937"><use href="#i-robot" x="345" y="600" width="32" height="32"/></g>
<text x="345" y="650" font-size="12.5" font-weight="bold" fill="#1f2937">Nine-Agent</text>
<text x="345" y="665" font-size="12.5" font-weight="bold" fill="#1f2937">Self-Healing Fleet</text>
<text x="345" y="681" font-size="10" fill="#6b7280">(autonomous, inside the</text>
<text x="345" y="694" font-size="10" fill="#6b7280">platform boundary)</text>

<!-- right: external systems -->
<g>
  <rect x="910" y="90" width="235" height="560" rx="8" fill="#f4f5f7" stroke="none"/>
  <text x="930" y="78" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6b7280">EXTERNAL SYSTEMS</text>

  <g color="#1f2937"><use href="#i-git" x="935" y="120" width="26" height="26"/></g>
  <text x="975" y="138" font-size="12.5" font-weight="bold" fill="#1f2937">GitHub</text>
  <text x="975" y="152" font-size="10" fill="#4b5563">source, pull requests</text>

  <g color="#1f2937"><use href="#i-chat" x="935" y="185" width="26" height="26"/></g>
  <text x="975" y="203" font-size="12.5" font-weight="bold" fill="#1f2937">Slack</text>
  <text x="975" y="217" font-size="10" fill="#4b5563">one-click approvals</text>

  <g color="#1f2937"><use href="#i-brain" x="935" y="250" width="26" height="26"/></g>
  <text x="975" y="264" font-size="12.5" font-weight="bold" fill="#1f2937">Large Language Model</text>
  <text x="975" y="278" font-size="12.5" font-weight="bold" fill="#1f2937">Provider</text>
  <text x="975" y="292" font-size="10" fill="#4b5563">OpenAI / Ollama</text>

  <g color="#1f2937"><use href="#i-workflow" x="935" y="325" width="26" height="26"/></g>
  <text x="975" y="343" font-size="12.5" font-weight="bold" fill="#1f2937">Argo CD</text>
  <text x="975" y="357" font-size="10" fill="#4b5563">deployment sync / rollback</text>

  <g color="#1f2937"><use href="#i-card" x="935" y="390" width="26" height="26"/></g>
  <text x="975" y="408" font-size="12.5" font-weight="bold" fill="#1f2937">Stripe</text>
  <text x="975" y="422" font-size="10" fill="#4b5563">billing and invoicing</text>

  <text x="935" y="470" font-size="12.5" font-weight="bold" fill="#1f2937">Incident Sources</text>
  <text x="935" y="488" font-size="10" fill="#4b5563">Sentry, Datadog,</text>
  <text x="935" y="501" font-size="10" fill="#4b5563">PagerDuty (webhooks)</text>

  <text x="935" y="545" font-size="12.5" font-weight="bold" fill="#1f2937">Identity Provider</text>
  <text x="935" y="563" font-size="10" fill="#4b5563">WorkOS (Single Sign-On)</text>
</g>

<!-- connectors: actors to platform -->
<g stroke="#1f2937" stroke-width="1.3" fill="none" marker-end="url(#ah)">
  <path d="M295 195 C 380 220, 400 260, 428 320"/>
  <path d="M295 355 L 428 375"/>
  <path d="M295 510 C 380 480, 400 440, 428 400"/>
</g>

<!-- platform to agent fleet -->
<path d="M470 450 C 430 500, 400 560, 375 598" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
<text x="392" y="540" font-size="10" fill="#4b5563">delegates repair work to</text>

<!-- connectors: platform to external systems -->
<g stroke="#1f2937" stroke-width="1.3" fill="none" marker-end="url(#ah)">
  <path d="M772 320 C 850 260, 880 190, 933 145"/>
  <path d="M772 340 C 850 280, 880 230, 933 210"/>
  <path d="M772 360 L 933 275"/>
  <path d="M772 380 C 850 400, 880 360, 933 335"/>
  <path d="M772 400 C 850 440, 880 420, 933 400"/>
</g>
<path d="M772 415 C 850 470, 880 480, 933 490" stroke="#1f2937" stroke-width="1.3" fill="none" marker-end="url(#ah)" marker-start="url(#ah)"/>
<path d="M772 430 C 850 520, 880 550, 933 560" stroke="#1f2937" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>

<text x="600" y="710" text-anchor="middle" font-size="11" fill="#6b7280">All external calls are mediated by the platform — no human or agent talks to GitHub, the LLM provider, or Argo CD directly.</text>
</svg>
