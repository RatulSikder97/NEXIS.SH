<text x="705" y="1300" text-anchor="middle" font-size="11" fill="#6b7280">Role-additive Role-Based Access Control (RBAC): each tier inherits every use case of the tier below it (hollow-triangle generalisation arrows).</text>
<text x="705" y="1320" text-anchor="middle" font-size="11" fill="#6b7280">The Nine-Agent Fleet runs autonomously inside the platform and surfaces to a human only at the highlighted approval gate.</text>
</svg>
