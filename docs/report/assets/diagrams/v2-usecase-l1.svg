<!--
NEXIS DIAGRAM ICON LIBRARY
Style: 24x24 viewBox, 1.6px stroke, round joins/caps, no fill (stroke="currentColor"),
single-color line-art so every icon inherits whatever ink color the diagram uses.
Reference via: <use href="icon-library.svg#i-postgres" x=".." y=".." width="28" height="28" color="#2c3e50"/>
(the library file itself must be inlined into each diagram's <defs>, not linked externally,
since rsvg-convert does not resolve cross-file <use> references — copy the whole <defs>
block into every diagram SVG that needs icons.)
-->

