<text x="416" y="598" font-size="10" fill="#6b7280">domain registered — platform</text>
<text x="416" y="611" font-size="10" fill="#6b7280">not yet deployed live</text>
<path d="M540 560 V514" stroke="#6b7280" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>

