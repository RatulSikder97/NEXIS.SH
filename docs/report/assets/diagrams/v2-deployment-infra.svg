<rect width="1240" height="700" fill="#ffffff"/>
<text x="620" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Deployment and Infrastructure Architecture</text>
<text x="620" y="60" text-anchor="middle" font-size="12" fill="#6b7280">Containers, Infrastructure as Code, continuous delivery, and observability</text>

<!-- ======================= GROUP 1: CONTAINERS AND DELIVERY ======================= -->
<rect x="60" y="120" width="560" height="520" rx="8" fill="#f4f5f7" stroke="none"/>
<text x="80" y="108" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6b7280">CONTAINERS AND DELIVERY</text>

<!-- GitHub Actions -->
<rect x="90" y="150" width="230" height="72" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-git" x="102" y="173" width="26" height="26"/></g>
<text x="140" y="182" font-size="12.5" font-weight="bold" fill="#1f2937">GitHub Actions</text>
<text x="140" y="198" font-size="10.5" fill="#4b5563">Continuous Integration —</text>
<text x="140" y="211" font-size="10.5" fill="#4b5563">builds and tests every commit</text>

<!-- arrow: GitHub Actions -> Docker -->
<path d="M205 222 V259" stroke="#1f2937" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
<rect x="210" y="235" width="126" height="15" fill="#ffffff"/>
<text x="214" y="246" font-size="10" fill="#4b5563">builds container images</text>

<!-- Docker -->
<rect x="90" y="262" width="230" height="86" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-container" x="102" y="292" width="26" height="26"/></g>
<text x="140" y="288" font-size="12.5" font-weight="bold" fill="#1f2937">Docker</text>
<text x="140" y="303" font-size="11" font-weight="bold" fill="#1f2937">(Podman-compatible runtime)</text>
<text x="140" y="320" font-size="10.5" fill="#4b5563">runtime for every service and</text>
<text x="140" y="333" font-size="10.5" fill="#4b5563">the preview-deploy engine</text>

<!-- arrow: Docker -> Argo CD -->
<path d="M205 348 V385" stroke="#1f2937" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
<rect x="210" y="361" width="98" height="15" fill="#ffffff"/>
<text x="214" y="372" font-size="10" fill="#4b5563">published images</text>

<!-- Argo CD -->
<rect x="90" y="388" width="230" height="78" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-workflow" x="102" y="414" width="26" height="26"/></g>
<text x="140" y="410" font-size="12.5" font-weight="bold" fill="#1f2937">Argo CD</text>
<text x="140" y="426" font-size="10.5" fill="#4b5563">GitOps continuous delivery —</text>
<text x="140" y="439" font-size="10.5" fill="#4b5563">syncs and rolls back</text>
<text x="140" y="452" font-size="10.5" fill="#4b5563">deployments</text>

<!-- Terraform -->
<rect x="380" y="150" width="210" height="86" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-terraform" x="392" y="180" width="26" height="26"/></g>
<text x="430" y="182" font-size="12.5" font-weight="bold" fill="#1f2937">Terraform</text>
<text x="430" y="198" font-size="10.5" fill="#4b5563">Infrastructure as Code —</text>
<text x="430" y="211" font-size="10.5" fill="#4b5563">provisions the production</text>
<text x="430" y="224" font-size="10.5" fill="#4b5563">environment on AWS</text>

<!-- arrow: Terraform -> target -->
<path d="M486 236 V297" stroke="#1f2937" stroke-width="1.3" fill="none" marker-end="url(#ah)"/>
<rect x="490" y="260" width="62" height="15" fill="#ffffff"/>
<text x="494" y="271" font-size="10" fill="#4b5563">provisions</text>

