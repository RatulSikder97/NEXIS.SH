<path d="M205 466 V540 H487 V515" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#ahb)"/>
<rect x="226" y="521" width="240" height="15" fill="#ffffff"/>
<text x="346" y="532" text-anchor="middle" font-size="10" fill="#4b5563">syncs desired state — rolls back on failure</text>

