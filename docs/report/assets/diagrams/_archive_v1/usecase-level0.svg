<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="760" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="bold">Figure: Level 0 Use Case Diagram</text>

  <!-- system boundary -->
  <rect x="330" y="80" width="440" height="600" fill="#f7f9fc" stroke="#222" stroke-width="1.5"/>
  <ellipse cx="550" cy="380" rx="190" ry="90" fill="#cfe3ff" stroke="#1c4e91" stroke-width="1.5"/>
  <text x="550" y="372" text-anchor="middle" font-size="14" font-weight="bold">NEXIS</text>
  <text x="550" y="392" text-anchor="middle" font-size="14" font-weight="bold">Autonomous Engineering</text>
  <text x="550" y="412" text-anchor="middle" font-size="14" font-weight="bold">Platform</text>

  <!-- Actors left -->
  <g font-size="12">
    <!-- stick figure helper repeated -->
    <g id="a1" transform="translate(60,140)">
      <circle cx="20" cy="10" r="10" fill="none" stroke="#222" stroke-width="1.5"/>
      <line x1="20" y1="20" x2="20" y2="55" stroke="#222" stroke-width="1.5"/>
      <line x1="0" y1="32" x2="40" y2="32" stroke="#222" stroke-width="1.5"/>
      <line x1="20" y1="55" x2="4" y2="82" stroke="#222" stroke-width="1.5"/>
      <line x1="20" y1="55" x2="36" y2="82" stroke="#222" stroke-width="1.5"/>
      <text x="20" y="98" text-anchor="middle" font-weight="bold">Owner /</text>
      <text x="20" y="112" text-anchor="middle" font-weight="bold">Admin</text>
    </g>
    <g transform="translate(60,300)">
      <circle cx="20" cy="10" r="10" fill="none" stroke="#222" stroke-width="1.5"/>
      <line x1="20" y1="20" x2="20" y2="55" stroke="#222" stroke-width="1.5"/>
      <line x1="0" y1="32" x2="40" y2="32" stroke="#222" stroke-width="1.5"/>
      <line x1="20" y1="55" x2="4" y2="82" stroke="#222" stroke-width="1.5"/>
      <line x1="20" y1="55" x2="36" y2="82" stroke="#222" stroke-width="1.5"/>
      <text x="20" y="98" text-anchor="middle" font-weight="bold">Engineer /</text>
      <text x="20" y="112" text-anchor="middle" font-weight="bold">Member</text>
    </g>
    <g transform="translate(60,460)">
      <circle cx="20" cy="10" r="10" fill="none" stroke="#222" stroke-width="1.5"/>
      <line x1="20" y1="20" x2="20" y2="55" stroke="#222" stroke-width="1.5"/>
      <line x1="0" y1="32" x2="40" y2="32" stroke="#222" stroke-width="1.5"/>
      <line x1="20" y1="55" x2="4" y2="82" stroke="#222" stroke-width="1.5"/>
      <line x1="20" y1="55" x2="36" y2="82" stroke="#222" stroke-width="1.5"/>
      <text x="20" y="98" text-anchor="middle" font-weight="bold">Viewer</text>
    </g>
  </g>

  <!-- Right side external systems -->
  <g font-size="12">
    <rect x="880" y="90" width="170" height="44" fill="#fdf3d8" stroke="#8a6100" stroke-width="1.4"/>
    <text x="965" y="117" text-anchor="middle">GitHub App</text>
    <rect x="880" y="150" width="170" height="44" fill="#fdf3d8" stroke="#8a6100" stroke-width="1.4"/>
    <text x="965" y="177" text-anchor="middle">Sentry / Datadog / PagerDuty</text>
    <rect x="880" y="210" width="170" height="44" fill="#fdf3d8" stroke="#8a6100" stroke-width="1.4"/>
    <text x="965" y="237" text-anchor="middle">Slack</text>
    <rect x="880" y="270" width="170" height="44" fill="#fdf3d8" stroke="#8a6100" stroke-width="1.4"/>
    <text x="965" y="297" text-anchor="middle">ArgoCD</text>
    <rect x="880" y="330" width="170" height="44" fill="#fdf3d8" stroke="#8a6100" stroke-width="1.4"/>
    <text x="965" y="357" text-anchor="middle">LLM (OpenAI / Ollama)</text>
    <rect x="880" y="390" width="170" height="44" fill="#fdf3d8" stroke="#8a6100" stroke-width="1.4"/>
    <text x="965" y="417" text-anchor="middle">Stripe (billing)</text>

    <!-- datastores -->
    <path d="M900 460 h130 v60 a65 8 0 0 1 -130 0 z" fill="#ffffff" stroke="#8a6100"/>
    <ellipse cx="965" cy="460" rx="65" ry="8" fill="#ffffff" stroke="#8a6100"/>
    <text x="965" y="500" text-anchor="middle">PostgreSQL / Neo4j</text>

    <path d="M900 555 h130 v50 a65 7 0 0 1 -130 0 z" fill="#ffffff" stroke="#8a6100"/>
    <ellipse cx="965" cy="555" rx="65" ry="7" fill="#ffffff" stroke="#8a6100"/>
    <text x="965" y="588" text-anchor="middle">MinIO patch store</text>
  </g>

  <!-- connecting lines -->
  <line x1="100" y1="176" x2="330" y2="220" stroke="#222" stroke-width="1.2"/>
  <line x1="100" y1="336" x2="330" y2="380" stroke="#222" stroke-width="1.2"/>
  <line x1="100" y1="496" x2="330" y2="470" stroke="#222" stroke-width="1.2"/>

  <line x1="770" y1="220" x2="880" y2="112" stroke="#222" stroke-width="1.2"/>
  <line x1="770" y1="260" x2="880" y2="172" stroke="#222" stroke-width="1.2"/>
  <line x1="770" y1="310" x2="880" y2="232" stroke="#222" stroke-width="1.2"/>
  <line x1="770" y1="360" x2="880" y2="292" stroke="#222" stroke-width="1.2"/>
  <line x1="770" y1="400" x2="880" y2="352" stroke="#222" stroke-width="1.2"/>
  <line x1="770" y1="440" x2="880" y2="412" stroke="#222" stroke-width="1.2"/>
  <line x1="770" y1="480" x2="900" y2="490" stroke="#222" stroke-width="1.2"/>
  <line x1="770" y1="520" x2="900" y2="575" stroke="#222" stroke-width="1.2"/>

  <text x="550" y="710" text-anchor="middle" font-size="12" fill="#444">Three human actors interact through a common web console; nine autonomous agents run inside the platform boundary</text>
  <text x="550" y="728" text-anchor="middle" font-size="12" fill="#444">and mediate every external system on their behalf — no human ever calls GitHub, the LLM, or ArgoCD directly.</text>
</svg>
