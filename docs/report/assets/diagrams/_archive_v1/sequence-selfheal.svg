<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ars" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1400" height="1000" fill="#ffffff"/>
  <text x="700" y="30" text-anchor="middle" font-size="20" font-weight="bold">Figure: Self-Healing Loop — Sequence Diagram</text>

  <!-- lifelines -->
  <g font-size="10.5" font-weight="bold" text-anchor="middle">
    <!-- x positions -->
    <!-- Source 60, Sentinel 170, Pathfinder 280, Synth 390, Architect 500, Backend 600, QA 690, DevOps 780, DataEng 870, Validator 970, Approval 1080, Admin 1180, GitOps 1280, Deploy 1380 -->
    <g>
      <rect x="20" y="50" width="90" height="30" fill="#dfeeff" stroke="#1c4e91"/><text x="65" y="70">Fault Source</text>
      <rect x="130" y="50" width="80" height="30" fill="#e8f0ff" stroke="#2c5aa0"/><text x="170" y="70">Sentinel</text>
      <rect x="235" y="50" width="90" height="30" fill="#e8f0ff" stroke="#2c5aa0"/><text x="280" y="70">Pathfinder</text>
      <rect x="345" y="50" width="90" height="30" fill="#e8f0ff" stroke="#2c5aa0"/><text x="390" y="70">Synthesiser</text>
      <rect x="455" y="50" width="90" height="30" fill="#e9f9ec" stroke="#2f8f4e"/><text x="500" y="70">Architect</text>
      <rect x="555" y="50" width="90" height="30" fill="#e9f9ec" stroke="#2f8f4e"/><text x="600" y="70">Backend</text>
      <rect x="655" y="50" width="70" height="30" fill="#e9f9ec" stroke="#2f8f4e"/><text x="690" y="70">QA</text>
      <rect x="735" y="50" width="90" height="30" fill="#e9f9ec" stroke="#2f8f4e"/><text x="780" y="70">DevOps</text>
      <rect x="835" y="50" width="90" height="30" fill="#e9f9ec" stroke="#2f8f4e"/><text x="880" y="70">DataEng.</text>
      <rect x="935" y="50" width="90" height="30" fill="#fdeee0" stroke="#c15b0f"/><text x="980" y="70">Validator</text>
      <rect x="1035" y="50" width="100" height="30" fill="#fdeee0" stroke="#c15b0f"/><text x="1085" y="70">ApprovalGate</text>
      <rect x="1145" y="50" width="80" height="30" fill="#dfeeff" stroke="#1c4e91"/><text x="1185" y="70">Admin</text>
      <rect x="1235" y="50" width="80" height="30" fill="#fdeee0" stroke="#c15b0f"/><text x="1275" y="70">GitOps</text>
      <rect x="1325" y="50" width="60" height="30" fill="#fdeee0" stroke="#c15b0f"/><text x="1355" y="70">Deploy</text>
    </g>
  </g>

  <!-- lifelines vertical -->
  <g stroke="#bbb" stroke-width="1">
    <line x1="65" y1="80" x2="65" y2="960"/>
    <line x1="170" y1="80" x2="170" y2="960"/>
    <line x1="280" y1="80" x2="280" y2="960"/>
    <line x1="390" y1="80" x2="390" y2="960"/>
    <line x1="500" y1="80" x2="500" y2="960"/>
    <line x1="600" y1="80" x2="600" y2="960"/>
    <line x1="690" y1="80" x2="690" y2="960"/>
    <line x1="780" y1="80" x2="780" y2="960"/>
    <line x1="880" y1="80" x2="880" y2="960"/>
    <line x1="980" y1="80" x2="980" y2="960"/>
    <line x1="1085" y1="80" x2="1085" y2="960"/>
    <line x1="1185" y1="80" x2="1185" y2="960"/>
    <line x1="1275" y1="80" x2="1275" y2="960"/>
    <line x1="1355" y1="80" x2="1355" y2="960"/>
  </g>

  <!-- messages -->
  <g font-size="10" fill="#111">
    <line x1="65" y1="110" x2="170" y2="110" stroke="#222" marker-end="url(#ars)"/><text x="70" y="104">1: webhook / spike (source-fanned)</text>

    <line x1="170" y1="145" x2="980" y2="145" stroke="#999" stroke-dasharray="3 3"/><text x="600" y="139" text-anchor="middle" fill="#888">incidents_raw row polled by RecoveryPipeline trigger</text>

    <line x1="170" y1="175" x2="280" y2="175" stroke="#222" marker-end="url(#ars)"/><text x="175" y="169">2: Sentinel.Detect (stub)</text>
    <line x1="280" y1="200" x2="280" y2="200" stroke="#222"/>
    <line x1="280" y1="205" x2="280" y2="205"/>
    <line x1="280" y1="210" x2="390" y2="210" stroke="#222" marker-end="url(#ars)"/><text x="285" y="204">3: Pathfinder.Diagnose — Neo4j walk + causal-inference rank</text>

    <line x1="390" y1="245" x2="500" y2="245" stroke="#222" marker-end="url(#ars)"/><text x="395" y="239">4: Synthesiser.Plan — classify, select agent set</text>

    <line x1="500" y1="280" x2="500" y2="280"/>
    <line x1="1235" y1="280" x2="500" y2="280" stroke="#6a3fb0" stroke-dasharray="4 3" marker-end="url(#ars)"/>
    <text x="700" y="274" text-anchor="middle" fill="#6a3fb0">5: LLM completion (structured JSON, schema-validated)</text>

    <line x1="500" y1="315" x2="600" y2="315" stroke="#222" marker-end="url(#ars)"/><text x="505" y="309">6: Architect.Solution — plan + affected_files</text>
    <line x1="600" y1="350" x2="690" y2="350" stroke="#222" marker-end="url(#ars)"/><text x="605" y="344">7: Backend.Codegen — minimal unified diff</text>
    <line x1="690" y1="385" x2="780" y2="385" stroke="#222" marker-end="url(#ars)"/><text x="695" y="379">8: QA.TestGen — property tests</text>

    <line x1="780" y1="420" x2="880" y2="420" stroke="#222" marker-end="url(#ars)"/><text x="700" y="414" text-anchor="middle">9a/9b: DevOps.Pipeline ‖ DataEngineer.Migrations (parallel)</text>
    <line x1="880" y1="425" x2="780" y2="425" stroke="#222"/>

    <line x1="780" y1="460" x2="980" y2="460" stroke="#222" marker-end="url(#ars)"/><text x="785" y="454">10: Backend.Codegen result → Validator.Validate</text>
    <line x1="980" y1="495" x2="980" y2="495"/>
    <text x="985" y="510">11: docker run --network=none, pytest+Hypothesis, coverage</text>

    <line x1="980" y1="530" x2="1085" y2="530" stroke="#222" marker-end="url(#ars)"/><text x="985" y="524">12: ApprovalGate.Route — severity = f(scenario, sensitive-path, contract-violation)</text>

    <line x1="1085" y1="565" x2="1185" y2="565" stroke="#c15b0f" marker-end="url(#ars)"/><text x="1090" y="559" fill="#c15b0f">13: notify (Slack/email) — HIGH/MEDIUM waits for human</text>
    <line x1="1185" y1="610" x2="1085" y2="610" stroke="#c15b0f" marker-end="url(#ars)"/><text x="1000" y="604" fill="#c15b0f">14: approve / reject / modify (signal)</text>

    <rect x="1035" y="630" width="100" height="26" fill="#eafaf1" stroke="#1f8a5a"/>
    <text x="1085" y="647" text-anchor="middle" font-size="9">alt: LOW severity auto-approves; MEDIUM auto-approves after 120s countdown unless overridden</text>

    <line x1="1085" y1="690" x2="1275" y2="690" stroke="#222" marker-end="url(#ars)"/><text x="1090" y="684">15: GitOpsDeploy — blob/tree/commit/ref/PR</text>
    <line x1="1275" y1="725" x2="1355" y2="725" stroke="#222" marker-end="url(#ars)" stroke-dasharray="4 3"/><text x="1200" y="719">16 (if source=deploy_engine): DeployEngine.Redeploy</text>

    <line x1="1085" y1="760" x2="1275" y2="760" stroke="#222" marker-end="url(#ars)"/><text x="1090" y="754">17: post-deploy health window — watch incidents_raw for fresh fatal</text>

    <rect x="1035" y="780" width="100" height="26" fill="#fdeee0" stroke="#c15b0f"/>
    <text x="1085" y="797" text-anchor="middle" font-size="9">alt: SLO breach detected</text>
    <line x1="1085" y1="820" x2="1275" y2="820" stroke="#a52a4a" marker-end="url(#ars)"/><text x="1090" y="814" fill="#a52a4a">18: ArgoCD.Rollback → prior-known-good revision</text>

    <line x1="65" y1="870" x2="1085" y2="870" stroke="#333" stroke-dasharray="2 4"/>
    <text x="575" y="864" text-anchor="middle" font-weight="bold">Pipeline.Complete — every step recorded as an ActivityEvent (SSE-streamed to the incident timeline)</text>
  </g>

  <text x="700" y="960" text-anchor="middle" font-size="12" fill="#444">Total steady-state wall-clock (observed, local Ollama models): ~35s–2min depending on scenario complexity and LLM latency.</text>
</svg>
