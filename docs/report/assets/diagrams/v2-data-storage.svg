<rect width="1100" height="700" fill="#ffffff"/>
<text x="550" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Figure 4.3: Data and Storage Architecture</text>
<text x="550" y="62" text-anchor="middle" font-size="12" fill="#6b7280">PostgreSQL, Neo4j, Redis, and MinIO, and what each one is responsible for</text>

<!-- writers band -->
<text x="100" y="90" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6b7280">WRITE INITIATORS</text>
<rect x="88" y="98" width="924" height="76" rx="8" fill="#f4f5f7" stroke="none"/>

<!-- Web Console -->
<rect x="100" y="106" width="260" height="60" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-browser" x="116" y="123" width="26" height="26"/></g>
<text x="154" y="132" font-size="12.5" font-weight="bold" fill="#1f2937">Web Console</text>
<text x="154" y="148" font-size="10.5" fill="#4b5563">Next.js — human operators</text>

<!-- API -->
<rect x="420" y="106" width="260" height="60" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-service" x="436" y="123" width="26" height="26"/></g>
<text x="474" y="126" font-size="12.5" font-weight="bold" fill="#1f2937">Application Programming</text>
<text x="474" y="140" font-size="12.5" font-weight="bold" fill="#1f2937">Interface (API)</text>
<text x="474" y="156" font-size="10.5" fill="#4b5563">human-facing endpoints</text>

<!-- Agent fleet -->
<rect x="740" y="106" width="260" height="60" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-robot" x="756" y="123" width="26" height="26"/></g>
<text x="794" y="132" font-size="12.5" font-weight="bold" fill="#1f2937">Autonomous Agent Fleet</text>
<text x="794" y="148" font-size="10.5" fill="#4b5563">nine specialised agents</text>

<!-- writer -> control-plane connectors -->
<path d="M230 174 V210 H505 V252" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M550 174 V252" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M870 174 V210 H595 V252" fill="none" stroke="#1f2937" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah)"/>

<!-- legend -->
<rect x="60" y="255" width="230" height="84" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.1"/>
<text x="76" y="275" font-size="11" font-weight="bold" letter-spacing="0.5" fill="#6b7280">LEGEND</text>
<path d="M76 292 H108" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="122" y="289" font-size="10" fill="#4b5563">human-initiated write</text>
<text x="122" y="301" font-size="10" fill="#4b5563">(Web Console / API)</text>
<path d="M76 320 H108" fill="none" stroke="#1f2937" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="122" y="317" font-size="10" fill="#4b5563">agent-initiated write</text>
<text x="122" y="329" font-size="10" fill="#4b5563">(autonomous fleet)</text>

<!-- Control-Plane (single accent element) -->
<rect x="450" y="255" width="200" height="85" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<g color="#1f2937"><use href="#i-server" x="464" y="283" width="28" height="28"/></g>
<text x="502" y="288" font-size="13" font-weight="bold" fill="#1f2937">Control-Plane</text>
<text x="502" y="304" font-size="10.5" fill="#4b5563">Go (Golang) — sole reader</text>
<text x="502" y="317" font-size="10.5" fill="#4b5563">and writer of every store</text>

<!-- Control-Plane <-> Temporal link -->
<path d="M650 290 H764" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M764 290 H652" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="708" y="270" text-anchor="middle" font-size="10" fill="#4b5563">durable pipeline</text>
<text x="708" y="282" text-anchor="middle" font-size="10" fill="#4b5563">execution</text>

<!-- Temporal -->
<rect x="770" y="248" width="280" height="100" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-workflow" x="786" y="260" width="26" height="26"/></g>
<text x="824" y="272" font-size="12.5" font-weight="bold" fill="#1f2937">Temporal</text>
<text x="824" y="287" font-size="10.5" fill="#4b5563">workflow orchestration (own persistence)</text>
<text x="786" y="308" font-size="10.5" fill="#4b5563">Durable workflow state — every step of a</text>
<text x="786" y="321" font-size="10.5" fill="#4b5563">running or completed recovery pipeline</text>
<text x="786" y="334" font-size="10.5" fill="#4b5563">survives a process restart.</text>

<!-- control-plane -> store connectors -->
<!-- PostgreSQL: human (solid) + agent (dashed) pair -->
<path d="M470 340 V358 H156 V421" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ah)"/>
<path d="M482 340 V370 H168 V421" fill="none" stroke="#1f2937" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<!-- Neo4j: agent (dashed) -->
<path d="M525 340 V395 H420 V421" fill="none" stroke="#1f2937" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<!-- Redis: human request path (solid) -->
<path d="M575 340 V395 H680 V421" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ah)"/>
<!-- MinIO: agent (dashed) -->
<path d="M630 340 V366 H938 V421" fill="none" stroke="#1f2937" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah)"/>

<!-- stores row -->
<!-- PostgreSQL -->
<rect x="44" y="425" width="235" height="195" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-database" x="60" y="440" width="26" height="26"/></g>
<text x="98" y="457" font-size="12.5" font-weight="bold" fill="#1f2937">PostgreSQL</text>
<text x="98" y="472" font-size="10.5" fill="#4b5563">relational system of record</text>
<text x="60" y="497" font-size="10.5" fill="#4b5563">Tenant-scoped relational data: users,</text>
<text x="60" y="510" font-size="10.5" fill="#4b5563">projects, incidents, workflow runs,</text>
<text x="60" y="523" font-size="10.5" fill="#4b5563">approval decisions, deployments,</text>
<text x="60" y="536" font-size="10.5" fill="#4b5563">audit log, billing. Isolated per</text>
<text x="60" y="549" font-size="10.5" fill="#4b5563">organisation via Row-Level Security</text>
<text x="60" y="562" font-size="10.5" fill="#4b5563">(RLS). Extended with the pgvector</text>
<text x="60" y="575" font-size="10.5" fill="#4b5563">extension for retrieval-augmented</text>
<text x="60" y="588" font-size="10.5" fill="#4b5563">code search.</text>

<!-- Neo4j -->
<rect x="303" y="425" width="235" height="195" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-graph" x="319" y="440" width="26" height="26"/></g>
<text x="357" y="457" font-size="12.5" font-weight="bold" fill="#1f2937">Neo4j</text>
<text x="357" y="472" font-size="10.5" fill="#4b5563">graph database</text>
<text x="319" y="497" font-size="10.5" fill="#4b5563">Code dependency graph — walked</text>
<text x="319" y="510" font-size="10.5" fill="#4b5563">by the Pathfinder agent to trace a</text>
<text x="319" y="523" font-size="10.5" fill="#4b5563">fault symptom back to candidate</text>
<text x="319" y="536" font-size="10.5" fill="#4b5563">root-cause nodes.</text>

<!-- Redis -->
<rect x="562" y="425" width="235" height="195" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-cache" x="578" y="440" width="26" height="26"/></g>
<text x="616" y="457" font-size="12.5" font-weight="bold" fill="#1f2937">Redis</text>
<text x="616" y="472" font-size="10.5" fill="#4b5563">in-memory data store</text>
<text x="578" y="497" font-size="10.5" fill="#4b5563">Request rate-limiting and</text>
<text x="578" y="510" font-size="10.5" fill="#4b5563">short-lived caching.</text>

<!-- MinIO -->
<rect x="821" y="425" width="235" height="195" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-bucket" x="837" y="440" width="26" height="26"/></g>
<text x="875" y="457" font-size="12.5" font-weight="bold" fill="#1f2937">MinIO</text>
<text x="875" y="472" font-size="10.5" fill="#4b5563">object storage</text>
<text x="837" y="497" font-size="10.5" fill="#4b5563">Encrypted patch blob storage</text>
<text x="837" y="510" font-size="10.5" fill="#4b5563">(Amazon S3-compatible object</text>
<text x="837" y="523" font-size="10.5" fill="#4b5563">storage), holding every unified-diff</text>
<text x="837" y="536" font-size="10.5" fill="#4b5563">patch the Backend agent generates.</text>

<text x="550" y="662" text-anchor="middle" font-size="11" fill="#6b7280">The Control-Plane is the only component with credentials to any store — humans and agents never connect to a database directly; reads flow back over the same paths.</text>
</svg>
