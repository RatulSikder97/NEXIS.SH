<rect width="1380" height="780" fill="#ffffff"/>
<text x="690" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Figure 4.2: Component Architecture</text>
<text x="690" y="62" text-anchor="middle" font-size="12" fill="#6b7280">the control-plane, sidecar services, and web console that make up the platform boundary</text>

<!-- ===== left column: Web Console ===== -->
<rect x="50" y="170" width="230" height="175" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-webapp" x="74" y="190" width="28" height="28"/></g>
<text x="114" y="209" font-size="14" font-weight="bold" fill="#1f2937">Web Console</text>
<text x="78" y="250" font-size="11" fill="#4b5563">Next.js</text>
<text x="78" y="271" font-size="11" fill="#4b5563">React</text>
<text x="78" y="292" font-size="11" fill="#4b5563">TypeScript</text>
<text x="78" y="313" font-size="11" fill="#4b5563">Tailwind CSS</text>

<!-- ===== left column: Large Language Model Provider ===== -->
<rect x="50" y="560" width="230" height="115" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-brain" x="74" y="580" width="28" height="28"/></g>
<text x="114" y="592" font-size="13" font-weight="bold" fill="#1f2937">Large Language</text>
<text x="114" y="608" font-size="13" font-weight="bold" fill="#1f2937">Model Provider</text>
<text x="78" y="640" font-size="10.5" fill="#4b5563">OpenAI / Ollama</text>
<text x="78" y="655" font-size="10.5" fill="#4b5563">(remote or self-hosted model)</text>

<!-- ===== center: Control-Plane ===== -->
<rect x="420" y="120" width="450" height="545" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<g color="#1f2937"><use href="#i-server" x="445" y="142" width="30" height="30"/></g>
<text x="490" y="158" font-size="15" font-weight="bold" fill="#1f2937">Control-Plane</text>
<text x="490" y="176" font-size="10.5" fill="#4b5563">Go (Golang) service — platform core</text>

<!-- sub: API layer -->
<rect x="445" y="200" width="400" height="92" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-shield" x="465" y="218" width="26" height="26"/></g>
<text x="505" y="228" font-size="12.5" font-weight="bold" fill="#1f2937">Application Programming Interface (API) Layer</text>
<text x="505" y="248" font-size="10.5" fill="#4b5563">authentication · Role-Based Access Control (RBAC)</text>
<text x="505" y="263" font-size="10.5" fill="#4b5563">Row-Level Security (RLS)</text>

<!-- sub: Sentinel detector -->
<rect x="445" y="316" width="400" height="70" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-observability" x="465" y="332" width="26" height="26"/></g>
<text x="505" y="342" font-size="12.5" font-weight="bold" fill="#1f2937">Sentinel Detector</text>
<text x="505" y="362" font-size="10.5" fill="#4b5563">always-on background incident-detection process</text>

<!-- sub: Scheduled task runner -->
<rect x="445" y="410" width="400" height="92" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-service" x="465" y="428" width="26" height="26"/></g>
<text x="505" y="438" font-size="12.5" font-weight="bold" fill="#1f2937">Scheduled Task Runner</text>
<text x="505" y="458" font-size="10.5" fill="#4b5563">daily digest · quality-assurance continuous loop</text>
<text x="505" y="473" font-size="10.5" fill="#4b5563">billing · schema-drift check</text>

<!-- sub: Temporal Workflow region (single accent element of this diagram) -->
<rect x="445" y="526" width="400" height="110" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<g color="#1f2937"><use href="#i-workflow" x="465" y="548" width="28" height="28"/></g>
<text x="507" y="563" font-size="13" font-weight="bold" fill="#1f2937">Temporal Workflow</text>
<text x="507" y="583" font-size="10.5" fill="#4b5563">the nine-agent RecoveryPipeline runs here as a durable workflow</text>
<text x="507" y="605" font-size="10" fill="#6b7280">nine-agent self-healing loop — see Figure 4.4</text>

<!-- ===== right: sidecar services group ===== -->
<text x="1040" y="113" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6b7280">SIDECAR SERVICES</text>
<rect x="1020" y="125" width="320" height="575" rx="8" fill="#f4f5f7" stroke="none"/>

<!-- Validator -->
<rect x="1045" y="160" width="270" height="100" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
