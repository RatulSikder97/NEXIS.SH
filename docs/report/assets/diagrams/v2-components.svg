<text x="1105" y="190" font-size="12.5" font-weight="bold" fill="#1f2937">Validator</text>
<text x="1105" y="210" font-size="10.5" fill="#4b5563">Docker-sandboxed test runner</text>
<text x="1105" y="225" font-size="10.5" fill="#4b5563">Python (Hypothesis property-</text>
<text x="1105" y="240" font-size="10.5" fill="#4b5563">based testing)</text>

<!-- GitOps Service -->
<rect x="1045" y="295" width="270" height="100" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-git" x="1065" y="315" width="26" height="26"/></g>
<text x="1105" y="325" font-size="12.5" font-weight="bold" fill="#1f2937">GitOps Service</text>
<text x="1105" y="345" font-size="10.5" fill="#4b5563">Go (Golang)</text>
<text x="1105" y="360" font-size="10.5" fill="#4b5563">opens GitHub pull requests</text>
<text x="1105" y="375" font-size="10.5" fill="#4b5563">via a GitHub App</text>

<!-- Causal-Inference Service -->
<rect x="1045" y="430" width="270" height="100" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-graph" x="1065" y="450" width="26" height="26"/></g>
