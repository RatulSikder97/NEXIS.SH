<text x="1105" y="480" font-size="10.5" fill="#4b5563">Python</text>
<text x="1105" y="495" font-size="10.5" fill="#4b5563">graph-evidence root-cause</text>
<text x="1105" y="510" font-size="10.5" fill="#4b5563">ranking</text>

<!-- Deploy-Engine -->
<rect x="1045" y="565" width="270" height="100" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.4"/>
<g color="#1f2937"><use href="#i-container" x="1065" y="585" width="26" height="26"/></g>
<text x="1105" y="595" font-size="12.5" font-weight="bold" fill="#1f2937">Deploy-Engine</text>
<text x="1105" y="615" font-size="10.5" fill="#4b5563">Go (Golang)</text>
<text x="1105" y="630" font-size="10.5" fill="#4b5563">clones, builds, and runs preview</text>
<text x="1105" y="645" font-size="10.5" fill="#4b5563">containers via Docker</text>

