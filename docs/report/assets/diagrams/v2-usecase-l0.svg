</defs>

<rect width="1100" height="720" fill="#ffffff"/>
<text x="550" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Use Case Diagram, Level 0</text>
<text x="550" y="60" text-anchor="middle" font-size="12" fill="#6b7280">The three human actors and the autonomous agent fleet against the system boundary</text>

<!-- group headers -->
<text x="80" y="104" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6b7280">HUMAN ACTORS</text>
<text x="830" y="104" font-size="13" font-weight="bold" letter-spacing="0.5" fill="#6b7280">EXTERNAL SYSTEMS</text>

<!-- central system ellipse -->
<ellipse cx="550" cy="360" rx="185" ry="95" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="550" y="345" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Nexis</text>
<text x="550" y="368" text-anchor="middle" font-size="11.5" fill="#4b5563">Multi-Agent Autonomous</text>
<text x="550" y="384" text-anchor="middle" font-size="11.5" fill="#4b5563">Engineering Platform</text>

<!-- left: human actors as UML stick figures -->
<g stroke="#1f2937" stroke-width="1.6" fill="none" stroke-linecap="round">
  <!-- Owner / Administrator (ay=140) -->
  <circle cx="150" cy="150" r="10"/>
  <line x1="150" y1="160" x2="150" y2="186"/>
  <line x1="134" y1="168" x2="166" y2="168"/>
  <line x1="150" y1="186" x2="136" y2="204"/>
  <line x1="150" y1="186" x2="164" y2="204"/>
  <!-- Engineer / Member (ay=300) -->
  <circle cx="150" cy="310" r="10"/>
  <line x1="150" y1="320" x2="150" y2="346"/>
  <line x1="134" y1="328" x2="166" y2="328"/>
  <line x1="150" y1="346" x2="136" y2="364"/>
  <line x1="150" y1="346" x2="164" y2="364"/>
  <!-- Viewer (ay=460) -->
  <circle cx="150" cy="470" r="10"/>
  <line x1="150" y1="480" x2="150" y2="506"/>
  <line x1="134" y1="488" x2="166" y2="488"/>
  <line x1="150" y1="506" x2="136" y2="524"/>
  <line x1="150" y1="506" x2="164" y2="524"/>
</g>
<text x="150" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Owner / Administrator</text>
<text x="150" y="237" text-anchor="middle" font-size="10" fill="#4b5563">policy, billing, final approval</text>
<text x="150" y="382" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Engineer / Member</text>
<text x="150" y="397" text-anchor="middle" font-size="10" fill="#4b5563">investigates, approves patches</text>
<text x="150" y="542" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Viewer</text>
<text x="150" y="557" text-anchor="middle" font-size="10" fill="#4b5563">read-only observer</text>

<!-- bottom: autonomous agent-fleet actor -->
<g color="#1f2937"><use href="#i-robot" x="532" y="572" width="36" height="36"/></g>
<text x="550" y="630" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Nine-Agent Self-Healing Fleet</text>
<text x="550" y="646" text-anchor="middle" font-size="10" fill="#4b5563">autonomous software actor</text>

<!-- actor associations (plain UML association lines) -->
<g stroke="#1f2937" stroke-width="1.3" fill="none">
  <line x1="166" y1="168" x2="419" y2="293"/>
  <line x1="166" y1="328" x2="365" y2="360"/>
  <line x1="166" y1="488" x2="390" y2="408"/>
  <line x1="550" y1="568" x2="550" y2="457"/>
</g>

<!-- right: external system boxes -->
<g fill="#ffffff" stroke="#1f2937" stroke-width="1.4">
  <rect x="830" y="120" width="230" height="62" rx="8"/>
  <rect x="830" y="206" width="230" height="62" rx="8"/>
  <rect x="830" y="292" width="230" height="66" rx="8"/>
  <rect x="830" y="382" width="230" height="62" rx="8"/>
  <rect x="830" y="468" width="230" height="62" rx="8"/>
  <rect x="830" y="554" width="230" height="62" rx="8"/>
</g>

<g color="#1f2937"><use href="#i-git" x="844" y="138" width="26" height="26"/></g>
<text x="884" y="146" font-size="12.5" font-weight="bold" fill="#1f2937">GitHub</text>
<text x="884" y="162" font-size="10" fill="#4b5563">source, pull requests</text>

<g color="#1f2937"><use href="#i-chat" x="844" y="224" width="26" height="26"/></g>
<text x="884" y="232" font-size="12.5" font-weight="bold" fill="#1f2937">Slack</text>
<text x="884" y="248" font-size="10" fill="#4b5563">one-click approvals</text>

<g color="#1f2937"><use href="#i-brain" x="844" y="312" width="26" height="26"/></g>
<text x="884" y="316" font-size="12.5" font-weight="bold" fill="#1f2937">Large Language Model</text>
<text x="884" y="331" font-size="12.5" font-weight="bold" fill="#1f2937">Provider</text>
<text x="884" y="347" font-size="10" fill="#4b5563">OpenAI / Ollama</text>

<g color="#1f2937"><use href="#i-workflow" x="844" y="400" width="26" height="26"/></g>
<text x="884" y="408" font-size="12.5" font-weight="bold" fill="#1f2937">Argo CD</text>
<text x="884" y="424" font-size="10" fill="#4b5563">deployment sync / rollback</text>

<g color="#1f2937"><use href="#i-database" x="844" y="486" width="26" height="26"/></g>
<text x="884" y="494" font-size="12.5" font-weight="bold" fill="#1f2937">PostgreSQL</text>
<text x="884" y="510" font-size="10" fill="#4b5563">system of record</text>

<g color="#1f2937"><use href="#i-graph" x="844" y="572" width="26" height="26"/></g>
<text x="884" y="580" font-size="12.5" font-weight="bold" fill="#1f2937">Neo4j</text>
<text x="884" y="596" font-size="10" fill="#4b5563">code knowledge graph</text>

<!-- system associations: ellipse to external systems -->
<g stroke="#1f2937" stroke-width="1.3" fill="none">
  <line x1="681" y1="293" x2="828" y2="151"/>
  <line x1="710" y1="312" x2="828" y2="237"/>
  <line x1="729" y1="335" x2="828" y2="325"/>
  <line x1="732" y1="377" x2="828" y2="413"/>
  <line x1="718" y1="400" x2="828" y2="499"/>
  <line x1="692" y1="421" x2="828" y2="585"/>
</g>

<text x="550" y="703" text-anchor="middle" font-size="11" fill="#6b7280">Each association is elaborated into concrete use cases in the Level 1 diagram (Figure 4.7).</text>
</svg>
