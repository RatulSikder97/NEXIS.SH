# docker-compose.prod.yml — single-VM production overlay.
#
# Usage (always layered on top of the base file):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile agents --profile observability up -d
#
# What this overlay changes:
#   1. Adds Caddy — the only container holding a public listener (80/443).
#      Everything else stays bound to 127.0.0.1 in the base file.
#   2. Feeds NEXT_PUBLIC_* to the web image as BUILD ARGS. Next inlines them
#      into the client bundle at compile time; runtime env cannot fix an
#      already-built bundle. See apps/web/Dockerfile.
#   3. Sets APP_ENV=prod + ALLOW_SELF_HOSTED=1 so session cookies carry the
#      Secure flag without tripping Config.FatalIfLocalInCloud, which demands
#      managed providers (WorkOS/Stripe/S3/KMS/SES/Temporal Cloud) that a
#      self-hosted box does not have.
#   4. Rotates the credentials that are env-driven: the `nexis` Postgres
#      superuser, Neo4j, and MinIO.
#      NOT rotated: `nexis_app` (password baked into
#      infra/postgres/init/01-nexis-app-role.sql) and `nexis_gitops` (baked
#      into migration 0018_phase6_gitops_role.up.sql). Both are reachable only
#      from inside the bridge network. Changing them means editing SQL that
#      runs once on a fresh volume, so they are deliberately left alone.
#   5. Tightens memory limits. The box is 2 vCPU / 3.7 GiB; the base file's
#      limits total ~10 GiB. These caps plus a 12 GiB swapfile let the full
#      profile set boot. Expect swap pressure under load — see DEPLOY.md.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - control-plane
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [nexis]

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    deploy:
      resources:
        limits:
          memory: 128m

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    deploy:
      resources:
        limits:
          memory: 256m

  # The base entrypoint hardcodes minioadmin/minioadmin. Re-point it at the
  # rotated credentials, otherwise the three buckets are never created and
  # every patch-store write fails.
  minio-init:
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/nexis-patches &&
        mc mb --ignore-existing local/nexis-audit-archive &&
        mc mb --ignore-existing local/nexis-eval-artifacts
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}

  mailhog:
    deploy:
      resources:
        limits:
          memory: 64m

  temporal:
    environment:
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    deploy:
      resources:
        limits:
          memory: 768m

  temporal-ui:
    environment:
      TEMPORAL_CORS_ORIGINS: ${APP_BASE_URL:?APP_BASE_URL required}
    deploy:
      resources:
        limits:
          memory: 128m

  neo4j:
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD required}
      # Default heap on a 3.7 GiB host is sized off total RAM and will fight
      # Postgres and the JVM in Temporal for the same pages. Pin it small.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 128m
    deploy:
      resources:
        limits:
          memory: 768m

  web:
    build:
      args:
        # Build-time — inlined into the client bundle.
        NEXT_PUBLIC_API_URL: ${APP_BASE_URL:?APP_BASE_URL required}
        NEXT_PUBLIC_APP_URL: ${APP_BASE_URL:?APP_BASE_URL required}
        NEXT_PUBLIC_SITE_URL: ${APP_BASE_URL:?APP_BASE_URL required}
        DATABASE_URL: postgres://nexis:${POSTGRES_PASSWORD:?}@postgres:5432/nexis?sslmode=disable
    environment:
      DATABASE_URL: postgres://nexis:${POSTGRES_PASSWORD:?}@postgres:5432/nexis?sslmode=disable
      # Same-origin: the browser talks to https://nexis.sh and Caddy splits
      # /v1/* off to the control-plane. Server components short-circuit to the
      # container hostname instead of going back out through the proxy.
      NEXT_PUBLIC_APP_URL: ${APP_BASE_URL:?}
      NEXT_PUBLIC_API_URL: ${APP_BASE_URL:?}
      NEXT_PUBLIC_SITE_URL: ${APP_BASE_URL:?}
      API_URL_INTERNAL: http://control-plane:8080
    deploy:
      resources:
        limits:
          memory: 512m

  control-plane:
    environment:
      APP_ENV: prod
      ALLOW_SELF_HOSTED: "1"
      # These two are newer than the base compose file's environment block,
      # which is an explicit allow-list — a key present only in .env is used
      # for ${...} interpolation but is NOT handed to the container. Without
      # them chat silently goes to api.openai.com instead of the Novita
      # gateway, and embeddings follow the chat provider instead of staying on
      # local Ollama (a width mismatch there silently invalidates every row in
      # code_embeddings, which is fixed at vector(768)).
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      # No trailing slash — middleware/cors.go does an exact string compare and
      # config.go concatenates this directly to build callback URLs.
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL required}
      DATABASE_URL: postgres://nexis:${POSTGRES_PASSWORD:?}@postgres:5432/nexis?sslmode=disable
      NEO4J_PASS: ${NEO4J_PASSWORD:?NEO4J_PASSWORD required}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
    deploy:
      resources:
        limits:
          memory: 384m

  validator:
    deploy:
      resources:
        limits:
          memory: 384m

  gitops:
    environment:
      # The base file never passes this. gitops reads AUDIT_SECRET directly in
      # cmd/server/main.go and, when empty, warns that every audit row from
      # AppendPROpened will be rejected — so PR-opened events vanish silently.
      AUDIT_SECRET: ${AUDIT_SECRET:?AUDIT_SECRET required}
    deploy:
      resources:
        limits:
          memory: 128m

  deploy-engine:
    deploy:
      resources:
        limits:
          memory: 128m

  causal-inference:
    deploy:
      resources:
        limits:
          memory: 384m

  otel-collector:
    deploy:
      resources:
        limits:
          memory: 192m

  prometheus:
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=12h"
    deploy:
      resources:
        limits:
          memory: 256m

  loki:
    deploy:
      resources:
        limits:
          memory: 192m

  tempo:
    deploy:
      resources:
        limits:
          memory: 192m

  grafana:
    environment:
      # The base file enables anonymous Admin. That is a dev convenience and
      # must not follow the stack onto a public box, even behind loopback.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  caddy_data:
  caddy_config:
