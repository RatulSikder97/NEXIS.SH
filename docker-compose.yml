# docker-compose.yml — infra + app services.
#
# Bootstrap:
#   cp .env.example .env
#   cp secrets/github-app.pem.example secrets/github-app.pem
#   docker compose up -d
#
# Secrets policy:
#   - All sensitive env vars use ${VAR:?...} so missing values fail fast at
#     `docker compose up`, instead of silently booting with a known-weak
#     default. Operators must supply real values via `.env`.
#   - Internal-only services (postgres, redis, minio, temporal, neo4j) are
#     bound to 127.0.0.1 — they are reachable from sibling containers via
#     the bridge network but not from the host LAN. Dev UIs the operator
#     actually opens in a browser (web 3000, control-plane 8080, mailhog
#     8025, grafana 3030, temporal-ui 8233) stay publicly bound.
#   - Distroless services (control-plane, validator, gitops) have no curl,
#     so their healthchecks have been removed for now. Liveness can be
#     verified externally via the HTTP `/healthz` endpoint each service
#     exposes.

name: nexis

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexis
      POSTGRES_USER: nexis
      POSTGRES_PASSWORD: nexis_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexis -d nexis"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [nexis]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [nexis]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [nexis]

  # One-shot bucket creator. Runs once after minio is healthy, then exits.
  # `restart: "no"` keeps it from looping after a clean exit.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/nexis-patches &&
        mc mb --ignore-existing local/nexis-audit-archive &&
        mc mb --ignore-existing local/nexis-eval-artifacts
    networks: [nexis]

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP — internal only
      - "8025:8025"             # web UI — dev convenience
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [nexis]

  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: nexis
      POSTGRES_PWD: nexis_dev_password
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 2>/dev/null | grep -q SERVING || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [nexis]

  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "8233:8080"
    networks: [nexis]

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/nexis_dev_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g
    networks: [nexis]

  causal-inference:
    build:
      context: services/causal-inference
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8090"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import grpc, sys; ch=grpc.insecure_channel('localhost:8090'); grpc.channel_ready_future(ch).result(timeout=2); sys.exit(0)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [nexis]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC — internal only
      - "127.0.0.1:4318:4318"   # OTLP HTTP — internal only
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [nexis]

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [nexis]

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infra/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "127.0.0.1:3100:3100"
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [nexis]

  tempo:
    image: grafana/tempo:2.7.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo-config.yaml:/etc/tempo.yaml:ro
    ports:
      - "127.0.0.1:3200:3200"
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [nexis]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [nexis]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://nexis:nexis_dev_password@postgres:5432/nexis?sslmode=disable
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8080
      # Server-side fetches from Next.js (e.g. dashboard /v1/me) dial the
      # control-plane over the in-network hostname; browser fetches still use
      # NEXT_PUBLIC_API_URL above. Outside docker compose these collapse to
      # the same value.
      API_URL_INTERNAL: http://control-plane:8080
      NODE_ENV: production
      PORT: "3000"
      OTEL_SERVICE_NAME: nexis-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [nexis]

  control-plane:
    build:
      context: services/control-plane
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      APP_ENV: dev
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_SYNTHESIS: ${OPENAI_MODEL_SYNTHESIS:-gpt-4o}
      OPENAI_MODEL_CHEAP: ${OPENAI_MODEL_CHEAP:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL_GENERAL: ${OLLAMA_MODEL_GENERAL:-llama3.1:8b}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      ALLOW_STUB_WORKOS: ${ALLOW_STUB_WORKOS:-0}
      # Critical secrets — must come from .env. No silent dev defaults.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET required — see .env.example}
      AUDIT_SECRET: ${AUDIT_SECRET:?AUDIT_SECRET required — see .env.example}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@nexis.local
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://nexis:nexis_dev_password@postgres:5432/nexis?sslmode=disable
      DATABASE_URL_APP: postgres://nexis_app:nexis_app_dev_password@postgres:5432/nexis?sslmode=disable
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY required — see .env.example}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET required — see .env.example}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-local}
      USAGE_TICK_SECONDS: ${USAGE_TICK_SECONDS:-60}
      WORKSPACE_PROVISION_FAIL: ${WORKSPACE_PROVISION_FAIL:-0.0}
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: nexis-recovery
      VALIDATOR_URL: http://validator:8081
      VALIDATOR_TOKEN: ${VALIDATOR_TOKEN:?VALIDATOR_TOKEN required — see .env.example}
      PATCH_STORE: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "0"
      WORKFLOW_STUB_DURATION_MS: ${WORKFLOW_STUB_DURATION_MS:-0}
      # Phase 5 — agents L1 + LLM spine
      TOKEN_BUDGET_TOKENS_IN: ${TOKEN_BUDGET_TOKENS_IN:-1000000}
      TOKEN_BUDGET_TOKENS_OUT: ${TOKEN_BUDGET_TOKENS_OUT:-200000}
      TOKEN_BUDGET_PERIOD_DAYS: ${TOKEN_BUDGET_PERIOD_DAYS:-30}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OPENAI_PROMPT_CACHE: ${OPENAI_PROMPT_CACHE:-1}
      EVAL_ENABLED: ${EVAL_ENABLED:-1}
      AGENT_SCHEMA_RETRY_MAX: ${AGENT_SCHEMA_RETRY_MAX:-2}
      AGENT_MODEL_ARCHITECT_OPENAI: ${AGENT_MODEL_ARCHITECT_OPENAI:-gpt-4o-mini}
      AGENT_MODEL_BACKEND_OPENAI:   ${AGENT_MODEL_BACKEND_OPENAI:-gpt-4o}
      AGENT_MODEL_QA_OPENAI:        ${AGENT_MODEL_QA_OPENAI:-gpt-4o-mini}
      AGENT_MODEL_DEVOPS_OPENAI:    ${AGENT_MODEL_DEVOPS_OPENAI:-gpt-4o-mini}
      AGENT_MODEL_DATAENG_OPENAI:   ${AGENT_MODEL_DATAENG_OPENAI:-gpt-4o-mini}
      AGENT_MODEL_ARCHITECT_OLLAMA: ${AGENT_MODEL_ARCHITECT_OLLAMA:-llama3.1:8b}
      AGENT_MODEL_BACKEND_OLLAMA:   ${AGENT_MODEL_BACKEND_OLLAMA:-qwen2.5-coder:14b}
      AGENT_MODEL_QA_OLLAMA:        ${AGENT_MODEL_QA_OLLAMA:-llama3.1:8b}
      AGENT_MODEL_DEVOPS_OLLAMA:    ${AGENT_MODEL_DEVOPS_OLLAMA:-llama3.1:8b}
      AGENT_MODEL_DATAENG_OLLAMA:   ${AGENT_MODEL_DATAENG_OLLAMA:-llama3.1:8b}
      # Phase 6 — Agents L2 + Approval Gate + GitOps + Slack + Neo4j + Causal.
      SENTINEL_ENABLED: ${SENTINEL_ENABLED:-1}
      SENTINEL_POLL_INTERVAL_MS: ${SENTINEL_POLL_INTERVAL_MS:-10000}
      NEO4J_URI:  bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: nexis_dev_password
      CAUSAL_GRPC_ENDPOINT: causal-inference:8090
      CAUSAL_ENABLED: ${CAUSAL_ENABLED:-1}
      PATHFINDER_LLM_REFINE: ${PATHFINDER_LLM_REFINE:-0}
      GITOPS_URL: http://gitops:8082
      GITOPS_TOKEN: ${GITOPS_TOKEN:?GITOPS_TOKEN required — see .env.example}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-12345}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      FIXTURE_REPO_OWNER: ${FIXTURE_REPO_OWNER:-nexis-eco}
      FIXTURE_REPO_NAME:  ${FIXTURE_REPO_NAME:-fixture-recovery-demo}
      FIXTURE_REPO_DEFAULT_BRANCH: ${FIXTURE_REPO_DEFAULT_BRANCH:-main}
      FIXTURE_REPO_INSTALLATION_ID: ${FIXTURE_REPO_INSTALLATION_ID:-98765}
      SLACK_ENABLED: ${SLACK_ENABLED:-1}
      APPROVAL_MEDIUM_TIMEOUT_SECONDS: ${APPROVAL_MEDIUM_TIMEOUT_SECONDS:-120}
      OTEL_SERVICE_NAME: nexis-control-plane
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8080:8080"
    # Liveness check intentionally omitted: control-plane runs on a
    # distroless base image with no curl/wget. Probe the HTTP /healthz
    # endpoint from outside (e.g. ALB target group) instead. TODO: add a
    # tiny `/healthz` binary or use gRPC health probe to restore in-container
    # checks.
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      mailhog:
        condition: service_started
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      causal-inference:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - github-app
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [nexis]

  validator:
    build:
      context: services/validator
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8081"
      VALIDATOR_TOKEN: ${VALIDATOR_TOKEN:?VALIDATOR_TOKEN required — see .env.example}
      NEXIS_VALIDATOR_IMAGE: nexis/validator-fixture:latest
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8081:8081"
    # Liveness check intentionally omitted: validator runs on a distroless
    # base image with no curl/wget. Probe /healthz over HTTP externally.
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [nexis]

  gitops:
    build:
      context: services/gitops
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://nexis_gitops:nexis_dev_password@postgres:5432/nexis?sslmode=disable
      GITOPS_TOKEN: ${GITOPS_TOKEN:?GITOPS_TOKEN required — see .env.example}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-12345}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8082:8082"
    # Liveness check intentionally omitted: gitops runs on a distroless
    # base image with no curl/wget. Probe /healthz over HTTP externally.
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - github-app
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [nexis]

networks:
  nexis:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  neo4j_data:
  grafana_data:

secrets:
  github-app:
    file: ./secrets/github-app.pem
